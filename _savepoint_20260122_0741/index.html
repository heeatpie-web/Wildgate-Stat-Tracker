<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Wildgate Stat Tracker</title>
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#0b0d14" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;900&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: ['class', '[data-mode="dark"]', '[data-mode="twilight"]'],
        theme: {
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
          },
          extend: {
            animation: {
              'fade-in': 'fadeIn 0.2s ease-out forwards',
              'slide-up': 'slideUp 0.3s cubic-bezier(0.2, 0.0, 0, 1.0) forwards',
              'scale-in': 'scaleIn 0.2s ease-out forwards',
            },
            keyframes: {
              fadeIn: { '0%': { opacity: '0' }, '100%': { opacity: '1' } },
              slideUp: { '0%': { transform: 'translateY(20px)', opacity: '0' }, '100%': { transform: 'translateY(0)', opacity: '1' } },
              scaleIn: { '0%': { transform: 'scale(0.9)', opacity: '0' }, '100%': { transform: 'scale(1)', opacity: '1' } },
            },
            colors: {
              md: {
                sys: {
                   primary: 'var(--md-sys-color-primary)',
                   onPrimary: 'var(--md-sys-color-on-primary)',
                   primaryContainer: 'var(--md-sys-color-primary-container)',
                   onPrimaryContainer: 'var(--md-sys-color-on-primary-container)',
                   surface: 'var(--md-sys-color-surface)',
                   onSurface: 'var(--md-sys-color-on-surface)',
                   surface1: 'var(--md-sys-color-surface-container-low)',
                   surface2: 'var(--md-sys-color-surface-container)',
                   surface3: 'var(--md-sys-color-surface-container-high)',
                   outline: 'var(--md-sys-color-outline)',
                   outlineVariant: 'var(--md-sys-color-outline-variant)',
                   background: 'var(--md-sys-color-background)',
                   onBackground: 'var(--md-sys-color-on-background)',
                   error: 'var(--md-sys-color-error)',
                   onError: 'var(--md-sys-color-on-error)',
                   errorContainer: 'var(--md-sys-color-error-container)',
                   onErrorContainer: 'var(--md-sys-color-on-error-container)',
                }
              }
            }
          }
        }
      }
    </script>
    <style>
      :root {
        --hue-ocean: 215;
        --hue-emerald: 150;
        --hue-crimson: 345;
        --hue-amber: 35;
        --hue-amethyst: 270;
        --hue-cyan: 190;
        --app-hue: var(--hue-ocean); 
      }
      
      body[data-theme='ocean'] { --app-hue: var(--hue-ocean); }
      body[data-theme='emerald'] { --app-hue: var(--hue-emerald); }
      body[data-theme='crimson'] { --app-hue: var(--hue-crimson); }
      body[data-theme='amber'] { --app-hue: var(--hue-amber); }
      body[data-theme='amethyst'] { --app-hue: var(--hue-amethyst); }
      body[data-theme='cyan'] { --app-hue: var(--hue-cyan); }
      body[data-mode='twilight'][data-theme='amber'] { --app-hue: var(--hue-amber); }

      /* --- LIGHT MODE --- */
      body[data-mode='light'] {
        --md-sys-color-primary: hsl(var(--app-hue), 80%, 35%); /* Dark enough for white text */
        --md-sys-color-on-primary: #ffffff; 
        --md-sys-color-primary-container: hsl(var(--app-hue), 90%, 90%);
        --md-sys-color-on-primary-container: hsl(var(--app-hue), 30%, 10%);
        --md-sys-color-background: #fffbf5; /* Warm off-white */
        --md-sys-color-on-background: #1c1b1f;
        
        --md-sys-color-surface: #fffbf5; 
        --md-sys-color-on-surface: #1c1b1f;
        
        /* Containers */
        --md-sys-color-surface-container-low: #f6f3ed;
        --md-sys-color-surface-container: #f0eee8;
        --md-sys-color-surface-container-high: #ebe8e2;

        --md-sys-color-outline: #79747e;
        --md-sys-color-outline-variant: #c4c7c5;
        --md-sys-color-error: #ba1a1a;
        --md-sys-color-on-error: #ffffff;
        --md-sys-color-error-container: #ffdad6;
        --md-sys-color-on-error-container: #410002;

        --color-win: #146c2e; 
        --color-loss: #c00015;
        --color-draw: #546e7a;
        --elevation-1: 0px 1px 3px 1px rgba(0,0,0,0.15), 0px 1px 2px 0px rgba(0,0,0,0.3);
        --elevation-2: 0px 2px 6px 2px rgba(0,0,0,0.15), 0px 1px 2px 0px rgba(0,0,0,0.3);
      }

      /* --- DARK MODE --- */
      body[data-mode='dark'] {
        --md-sys-color-primary: hsl(var(--app-hue), 80%, 70%); /* Softer pastel primary */
        --md-sys-color-on-primary: hsl(var(--app-hue), 40%, 15%);
        --md-sys-color-primary-container: hsl(var(--app-hue), 60%, 20%);
        --md-sys-color-on-primary-container: hsl(var(--app-hue), 90%, 95%);

        --md-sys-color-background: #111318; /* Dark Grey, not Black */
        --md-sys-color-on-background: #e2e2e6;
        
        --md-sys-color-surface: #111318;
        --md-sys-color-on-surface: #e2e2e6;

        /* Containers - Lighter than BG */
        --md-sys-color-surface-container-low: #191c20; 
        --md-sys-color-surface-container: #1d2024;
        --md-sys-color-surface-container-high: #282a2f;

        --md-sys-color-outline: #8e9199;
        --md-sys-color-outline-variant: #44474e;
        --md-sys-color-error: #ffb4ab;
        --md-sys-color-on-error: #690005;
        --color-win: #6dd58c; 
        --color-loss: #ffb4ab;
        --color-draw: #94a3b8;
        --elevation-1: 0 1px 3px 0 rgba(0, 0, 0, 0.3), 0 4px 8px 3px rgba(0, 0, 0, 0.15);
        --elevation-2: 0 4px 8px 3px rgba(0, 0, 0, 0.3), 0 6px 10px 4px rgba(0, 0, 0, 0.15);
      }
      
      body[data-theme='amber'][data-mode='dark'],
      body[data-theme='amber'][data-mode='twilight'] {
          --md-sys-color-on-primary: #402800;
      }


      /* --- TWILIGHT MODE (Discord-like) --- */
      body[data-mode='twilight'] {
        --md-sys-color-primary: hsl(var(--app-hue), 80%, 70%);
        --md-sys-color-on-primary: hsl(var(--app-hue), 40%, 15%);
        --md-sys-color-primary-container: hsl(var(--app-hue), 60%, 55%);
        --md-sys-color-on-primary-container: #ffffff;

        --md-sys-color-background: #313338; 
        --md-sys-color-on-background: #f2f3f5;
        --md-sys-color-surface: #313338;
        --md-sys-color-on-surface: #f2f3f5;

        --md-sys-color-surface-container-low: #2b2d31; 
        --md-sys-color-surface-container: #232428; 
        --md-sys-color-surface-container-high: #1e1f22; 

        --md-sys-color-outline: #b5bac1;
        --md-sys-color-outline-variant: #1e1f22;
        --color-win: #23a559;
        --color-loss: #da373c;
        --color-draw: #949ba4;
        --elevation-1: 0 1px 0 rgba(0,0,0,0.2), 0 1px 2px rgba(0,0,0,0.1);
        --elevation-2: 0 8px 16px rgba(0,0,0,0.24);
      }

      body {
        background-color: var(--md-sys-color-background);
        color: var(--md-sys-color-on-background);
        transition: background-color 0.2s ease, color 0.2s ease;
      }
      
      /* THIS CLASS IS CRITICAL FOR HIERARCHY */
      .md-card {
        background-color: var(--md-sys-color-surface-container-low);
        border-radius: 24px;
        padding: 24px;
        /* Replaced border with shadow/elevation for cleaner look */
        box-shadow: var(--elevation-1);
        border: none !important; 
      }

      .artifact-btn-active { background-color: var(--md-sys-color-primary) !important; color: var(--md-sys-color-on-primary) !important; }
      .combat-btn-active { border-color: var(--color-win) !important; color: var(--color-win) !important; }
      .yellow-btn-active { background-color: #f59e0b !important; color: black !important; }

      ::-webkit-scrollbar { width: 8px; height: 8px; }
      ::-webkit-scrollbar-thumb { background: var(--md-sys-color-outline-variant); border-radius: 4px; }
    </style>
<link rel="stylesheet" href="/index.css">
</head>
  <body data-mode="dark" data-theme="ocean">
    <svg style="display: none;">
      <defs>
        <filter id="protanopia-filter">
          <feColorMatrix type="matrix" values="0.567, 0.433, 0, 0, 0  0.558, 0.442, 0, 0, 0  0, 0.242, 0.758, 0, 0  0, 0, 0, 1, 0" />
        </filter>
        <filter id="deuteranopia-filter">
          <feColorMatrix type="matrix" values="0.625, 0.375, 0, 0, 0  0.7, 0.3, 0, 0, 0  0, 0.3, 0.7, 0, 0  0, 0, 0, 1, 0" />
        </filter>
        <filter id="tritanopia-filter">
          <feColorMatrix type="matrix" values="0.95, 0.05, 0, 0, 0  0, 0.433, 0.567, 0, 0  0, 0.475, 0.525, 0, 0  0, 0, 0, 1, 0" />
        </filter>
      </defs>
    </svg>
    <div id="root"></div>
    <script type="module" src="./index.tsx"></script>
  </body>
</html>
