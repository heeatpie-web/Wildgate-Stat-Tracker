name: Stream Ownership

on:
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ownership-check:
    name: Validate Stream File Ownership
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Check stream ownership rules
        run: node scripts/check-stream-ownership.cjs --stream auto --base origin/main --head HEAD
